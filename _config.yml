title: netget
description: A Gateway To the Web.
url: https://neurons-me.github.io
baseurl: "/netget"
image: "https://neurons-me.github.io/netget/assets/netget-og.png"

remote_theme: neurons-me/neurons-me

plugins:
  - jekyll-remote-theme

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
  hard_wrap: false

exclude:
  - Typescript/node_modules
  - Typescript/dist
  - Typescript/dist-types
  - Typescript/src
  - Typescript/tests
  - Typescript/scripts
  - Typescript/assets
  - Typescript/docs/index.md
  - Typescript/docs/Architecture.md
  - Typescript/docs/DomainMap.md
  - Typescript/docs/NetGet.md
  - Typescript/docs/Packaging.md
  - Typescript/docs/Placement.md
  - Typescript/docs/monad-exposure-policy.md
  - Typescript/docs/.vitepress
  - Typescript/docs/NRP
  - Typescript/.storybook
  - Python/__pycache__
  - Rust/target
  - node_modules
  - "*/node_modules"
  - vendor

me_theme:
  brand: netget
  favicon: "https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760629064/neurons.me_b50f6a.png?v=brain"
  social_image: "https://neurons-me.github.io/netget/assets/netget-og.png"
  nav:
    - label: All.This
      url: https://neurons-me.github.io/all.this/

gui_doc:
  root_url: https://neurons-me.github.io/netget/
  root_title: netget
  docs_url: https://neurons-me.github.io/netget/docs/
  github_url: https://github.com/neurons-me/netget
