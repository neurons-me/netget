<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ledWhite" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9c9c9"/>
    </radialGradient>
    <radialGradient id="ledTeal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f9488"/>
    </radialGradient>
    <radialGradient id="ledPeach" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f8b199"/>
      <stop offset="100%" stop-color="#e8592a"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="624" height="234" rx="26" fill="#121218" stroke="#2a2a2e" stroke-width="2"/>
  <rect x="8" y="8" width="624" height="234" rx="26" fill="url(#topGrad)"/>

  <circle cx="34" cy="34" r="4" fill="#3a3a3e"/>
  <circle cx="606" cy="34" r="4" fill="#3a3a3e"/>
  <circle cx="34" cy="216" r="4" fill="#3a3a3e"/>
  <circle cx="606" cy="216" r="4" fill="#3a3a3e"/>

  <image href="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1780604418/netget_gmdvxy-removebg-preview_eibfyi.png" x="220" y="26" width="200" height="66" preserveAspectRatio="xMidYMid meet"/>

  <line x1="50" y1="112" x2="590" y2="112" stroke="#2a2a2e" stroke-width="1"/>

  <text x="320" y="134" text-anchor="middle" fill="#6B6B68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2.5">LOCAL CHANNELS</text>

  <!-- Channel 1: local.netget (white) -->
  <g>
    <circle cx="160" cy="170" r="15" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <circle cx="160" cy="170" r="8" fill="url(#ledWhite)"/>
    <text x="160" y="205" text-anchor="middle" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">local.netget</text>
  </g>

  <!-- Channel 2: localhost (blue-green) -->
  <g>
    <circle cx="320" cy="170" r="15" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <circle cx="320" cy="170" r="8" fill="url(#ledTeal)"/>
    <text x="320" y="205" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">localhost</text>
  </g>

  <!-- Channel 3: 127.0.0.1 (red/peach) -->
  <g>
    <circle cx="480" cy="170" r="15" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <circle cx="480" cy="170" r="8" fill="url(#ledPeach)"/>
    <text x="480" y="205" text-anchor="middle" fill="#f8b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">127.0.0.1</text>
  </g>

  <text x="320" y="228" text-anchor="middle" fill="#6B6B68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">→ all resolve to netget</text>
</svg>
