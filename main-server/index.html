<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">node</title>
<script>
  window.__THIS_GUI_DISABLE_AUTOBOOT__ = true;
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .node {
    font-size: 15px;
    color: #555;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .hostname {
    font-size: 28px;
    font-weight: 600;
    color: #e8e8e8;
    letter-spacing: -0.5px;
    margin-bottom: 28px;
  }

  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 8px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  .status {
    font-size: 12px;
    color: #444;
    letter-spacing: 0.3px;
  }

  .footer {
    position: fixed;
    bottom: 28px;
    font-size: 11px;
    color: #2a2a2a;
    letter-spacing: 1px;
  }

  .corner-logo {
    position: fixed;
    right: 24px;
    bottom: 22px;
    width: 44px;
    height: auto;
    opacity: 0.18;
    filter: grayscale(1) brightness(0.75);
    mix-blend-mode: screen;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<div class="node">node</div>
<div class="hostname" id="hostname">—</div>
<div class="status"><span class="dot"></span>online</div>

<div class="footer">netget</div>
<img
  class="corner-logo"
  src="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760629056/neurons-grey_hxjcom.png"
  alt="neurons.me"
>

<div id="root"></div>

<script type="module">
  const h = location.hostname;
  document.getElementById('hostname').textContent = h;
  document.getElementById('page-title').textContent = h;

  const root = document.getElementById('root');
  const params = new URLSearchParams(window.location.search);
  const allowCdnBoot = params.get('cdn') === '1' || params.get('allowCdn') === '1';

  const bootCandidates = [
    './all.this/src/npm/dist/src/boot/browser-entry.js',
    '/all.this/src/npm/dist/src/boot/browser-entry.js',
    '../all.this/src/npm/dist/src/boot/browser-entry.js',
  ];

  const globalBootCandidates = [
    './all.this/src/npm/dist/src/boot/browser-global.js',
    '/all.this/src/npm/dist/src/boot/browser-global.js',
    '../all.this/src/npm/dist/src/boot/browser-global.js',
  ];

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const absoluteSrc = new URL(src, document.baseURI).href;
      const existing = Array.from(document.querySelectorAll('script[src]'))
        .find(node => node.src === absoluteSrc);
      if (existing) { resolve(true); return; }
      const script = document.createElement('script');
      script.src = src;
      script.async = false;
      if (/^https?:/i.test(src)) script.crossOrigin = 'anonymous';
      script.onload = () => resolve(true);
      script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
      document.head.appendChild(script);
    });
  }

  async function importFirst(candidates) {
    const failures = [];
    for (const candidate of candidates) {
      try { return await import(candidate); }
      catch (error) { failures.push({ candidate, message: error?.message || String(error) }); }
    }
    throw new Error('all.this boot unavailable\n' + failures.map(f => `${f.candidate} :: ${f.message}`).join('\n'));
  }

  async function loadScriptFirst(candidates) {
    const failures = [];
    for (const candidate of candidates) {
      try { await loadScript(candidate); return candidate; }
      catch (error) { failures.push({ candidate, message: error?.message || String(error) }); }
    }
    throw new Error('all.this static boot unavailable\n' + failures.map(f => `${f.candidate} :: ${f.message}`).join('\n'));
  }

  async function startGlobalBoot(options) {
    await loadScriptFirst(globalBootCandidates);
    const startAllThis = window.AllThisBoot?.startAllThis || window.AllThisBoot?.default;
    if (typeof startAllThis !== 'function') throw new Error('AllThisBoot.startAllThis missing');
    return startAllThis(options);
  }

  try {
    const bootOptions = { root, allowCdn: allowCdnBoot };
    if (window.location.protocol === 'file:') {
      await startGlobalBoot(bootOptions);
    } else {
      try {
        const boot = await importFirst(bootCandidates);
        const startAllThis = boot.startAllThis || boot.default;
        if (typeof startAllThis !== 'function') throw new Error('startAllThis export missing');
        await startAllThis(bootOptions);
      } catch (error) {
        console.warn('[netget] all.this ESM boot unavailable, trying static boot', error);
        await startGlobalBoot(bootOptions);
      }
    }
  } catch (error) {
    console.warn('[netget] all.this not available on this node', error);
  }
</script>

</body>
</html>
